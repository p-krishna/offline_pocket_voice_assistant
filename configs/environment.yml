name: assistant
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=2.0.2
  - portaudio
  - pip:
      - openwakeword>=0.6,<0.7
      - speexdsp-ns>=0.1.2
      - setuptools<81      # webrtcvad still imports pkg_resources
      - scipy
      - pytest
      - pyaudio
      - sounddevice
      - soundfile
      - silero-vad
      - webrtcvad
      - kokoro-onnx
